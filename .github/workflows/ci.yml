# Checks for the Agentry API.
#   push to develop          the image builds (DeepSeek Harness at dsh.pin + this plugin, its tsc included)
#   pull request to main     the same, and a check that package.json names a version not yet released
# The image is published to GHCR only after the merge (see publish.yml).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version not yet released
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json version against the release tags
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error file=package.json::Version $version is already released (tag v$version). Bump it on develop: npm version minor --no-git-tag-version (or patch / major / an exact version)."
            exit 1
          fi
          if ! scripts/ci/release-notes.sh "$version" | grep -q .; then
            echo "::warning file=CHANGELOG.md::No \"## $version\" section in CHANGELOG.md; the release notes will be generated from the commits."
          fi

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: DeepSeek Harness tag
        id: pin
        run: echo "tag=$(cat dsh.pin)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: DSH_TAG=${{ steps.pin.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
