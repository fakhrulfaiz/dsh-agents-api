        arguments:
          type: object
          additionalProperties: true
        output: {}
        error:
          oneOf:
            - type: string
            - type: "null"
        status:
          $ref: "#/components/schemas/ToolCallStatus"
        turn_id:
          type: string
        subagent_id:
          type: string
      required:
        - id
        - type
        - server_label
        - name
        - arguments
        - status
        - turn_id
    CommandExecutionItem:
