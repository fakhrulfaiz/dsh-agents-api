        time:
          type: string
        time_zone:
          type: string
      required:
        - date
        - time
        - time_zone
    ScheduleTiming:
      description: "DSH's tagged union, identical on input and output. Reads echo `at` as the UTC instant and `time` as `HH:mm:ss.SSS`. Time zones are explicit IANA names."
      oneOf:
        - type: object
          properties:
            kind:
              const: after
            after_seconds:
              type: integer
              minimum: 1
          required:
            - kind
            - after_seconds
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: at
            at:
              oneOf:
                - type: string
                  description: RFC 3339 instant.
                - $ref: "#/components/schemas/ScheduleLocalAt"
          required:
            - kind
            - at
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: every
            every_seconds:
              type: integer
              minimum: 60
          required:
            - kind
            - every_seconds
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: daily
            daily:
              type: object
              properties:
                time:
                  type: string
                time_zone:
                  type: string
              required:
                - time
                - time_zone
          required:
            - kind
            - daily
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: weekly
            weekly:
              type: object
              properties:
                time:
                  type: string
                time_zone:
                  type: string
                weekdays:
                  type: array
                  description: ISO weekdays, Monday 1 through Sunday 7.
                  items:
                    type: integer
                    minimum: 1
                    maximum: 7
              required:
                - time
                - time_zone
                - weekdays
          required:
            - kind
            - weekly
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: cron
            cron:
              type: object
              properties:
                expression:
                  type: string
                  description: Five fields, minute hour day-of-month month day-of-week.
                time_zone:
                  type: string
              required:
                - expression
                - time_zone
          required:
            - kind
            - cron
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: rrule
            rrule:
              type: string
              description: "`DTSTART` line and `RRULE` line."
          required:
            - kind
            - rrule
          additionalProperties: false
      discriminator:
        propertyName: kind
    AgentScheduleRun:
