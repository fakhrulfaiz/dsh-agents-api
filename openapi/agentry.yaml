        kind:
          type: string
          enum:
            - sandbox_escalation
            - user_question
            - tool_approval
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
          description: '`["approve","deny"]` for an approval; the option labels of a single question, else empty.'
        tool_name:
          type: string
          description: Approvals only, when known.
        call_id:
          type: string
          description: When known.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
          description: "`user_question` with several questions."
        subagent_id:
          type: string
          description: Set when a subagent of this session asked (its id in `/subagents`). Answer it on this session like any approval; it can be pending while the session has no open turn (status `requires_action`).
      required:
        - type
        - id
        - kind
        - prompt
        - options
    RequiredAction:
      oneOf:
        - $ref: "#/components/schemas/FunctionCallAction"
        - $ref: "#/components/schemas/EnvironmentConnectionAction"
        - $ref: "#/components/schemas/ApprovalAction"
    AgentSession:
      type: object
