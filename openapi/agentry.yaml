          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
        "413":
          description: "`message_too_large`: the files of the message total more than `uploads.maxMessageBytes`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: "`uploads_disabled`: the message carries files but the server has no `uploads.dir`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: Posting to a session that is not live resumes it from its Session log first (409 `session_not_resumable` for sessions created before migration 0002, 500 `session_resume_failed`). Approval answers do not resume. Posting while a new session's agent is still being set up waits for it; 409 `session_setup_failed` when that setup failed.
    get:
      summary: Stream session events
      tags:
        - Sessions
      parameters:
        - name: stream
          in: query
          schema:
            type: boolean
          description: Send `true` to stream.
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Last `id:` the client processed; replay resumes after it.
      responses:
        "200":
          description: Server-sent events.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE text; each `data:` line is a `SessionEvent`.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: |-
        Server-sent events when `stream=true` (`Content-Type: text/event-stream`). Each frame is

        ```
        id: <n>            (absent on ephemeral frames)
        event: <type>
        data: <SessionEvent JSON>
        ```

        The `event:` name equals the payload `type` (see the `SessionEvent` schema).

        Ids. Every event derived from the Session log carries an `id:`. Session status, turn, assistant message and slash-command events are numbered `1, 2, 3, ...` (`agent.session.created` is always 1). Item frames for the rest of the item log (user messages, reasoning, tool calls and outputs; `agent.session.turn.item.added` for a call, `agent.session.turn.item.done` otherwise) are numbered after the frame before them: `<n>.1`, `<n>.2`, ... (a reasoning item comes before the assistant message it belongs to). So the item frames never moved an existing id, and an integer `Last-Event-ID` saved before they existed still resumes at the same place. Compare ids as (`n`, `sub`) pairs, not as decimals (`12.10` follows `12.9`). The sequence is a pure function of the Session log, so ids and the payload `event_id` (`evt_<session_id>_<id>`) survive server restarts. A user message item's attachments carry their file ids, as in `GET .../items`.

        Ephemeral frames have no `id:` line, are never replayed, and do not shift later ids: the status snapshot written when a stream connects, the `idle` event that closes a streamed create without input, `error` events for a failed input dispatch, and the `requires_action`/`in_progress` events raised by approvals, and the `agent.session.subagent.*` events (subagent created, turn opened or ended, item saved, closed; they are not in this session's log, so re-read `/subagents`, which is rebuilt from the child logs, on open and on reconnect).

        Resume. Send `Last-Event-ID: <n>` or `<n>.<sub>` to receive every event after it, derived from the Session log, then live events without gaps or duplicates. A value that is not an id replays the whole history. A `Last-Event-ID` connection to a session with pending approvals additionally receives one ephemeral `agent.session.requires_action` snapshot. Without the header the stream starts with one status snapshot (`idle`, `in_progress`, `requires_action`, or `failed`).
