                  - service
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Keycloak access token (production), an Agentry API key `agk_...` (apiKeys mode), or the development key (development mode). The principal needs the `agentry-user` or `agentry-admin` role.
  parameters:
    OpenAIBeta:
      name: OpenAI-Beta
      in: header
      required: false
      schema:
        const: agents=v1
      description: Clients should send `agents=v1`.
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    TurnId:
      name: turn_id
      in: path
      required: true
      schema:
        type: string
    SubagentId:
      name: subagent_id
      in: path
      required: true
      schema:
        type: string
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema:
        type: string
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema:
        type: string
    FilePath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Slash-separated path; remaining segments are part of the value.
      allowReserved: true
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      schema:
        type: string
      description: Id of the last item of the previous page.
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
      description: Ignored by the session list (newest first).
  responses:
    BadRequest:
      description: Invalid request. `error.code` is `bad_request`, `invalid_request`, `invalid_approval_response`, `decision_not_applicable`, `unknown_call_id`, `unsupported_content_part`, `duplicate_file_id`, or `too_many_files`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Missing or invalid credential. `error.code` is `unauthenticated`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      headers:
        WWW-Authenticate:
          schema:
            const: Bearer
    Forbidden:
      description: The principal holds neither `agentry-user` nor `agentry-admin`. `error.code` is `forbidden`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown id or another owner's record (`resource_not_found`), `approval_not_found` for an approval answer, or `file_not_found` for a file id in a message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "`session_setting_not_live` (model or effort change not applicable), `session_not_resumable`, `file_attached` (delete of an attached file), `file_already_attached`, or `uploads_unsafe` (the workspace `uploads` entry is a symlink or not a directory)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ScheduleConflict:
      description: "`schedule_conflict` (stale `revision`), `schedule_execution_pending`, `schedule_target_archived`, or `session_not_resumable`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SchedulesUnavailable:
      description: The profile has no schedule service. `error.code` is `schedules_unavailable`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: "`session_resume_failed`, `event_apply_failed`, or another internal error."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    StoreUnavailable:
      description: The Postgres store is opening, failed to start, or a database call failed. `error.code` is `store_unavailable`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AgentSkill:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
          description: Discovery source, for example `project-agents`, `user-dsh`, or `bundled`.
      required:
        - name
    FileObject:
      type: object
      description: An uploaded file. `status` is `staged` until a message carrying it is sent, then `attached`.
      properties:
        id:
          type: string
          description: "`file_<random>`."
        object:
          const: file
        bytes:
          type: integer
        created_at:
          type: integer
          description: Epoch seconds.
        filename:
          type: string
          description: Sanitized leaf name.
        purpose:
          const: user_data
        media_type:
          type: string
          description: Server-decided media type.
        status:
          enum:
            - staged
            - attached
      required:
        - id
        - object
        - bytes
        - created_at
        - filename
        - purpose
        - media_type
        - status
    AgentCommand:
      type: object
      properties:
        name:
          type: string
          description: Lowercase command name without the leading slash.
        description:
          type: string
        input_hint:
          type: string
          description: Placeholder for the free-form text after the name; absent when the command takes none.
        accepts_attachments:
          type: boolean
      required:
        - name
        - description
        - accepts_attachments
    CommandRunRequest:
      type: object
      properties:
        input:
          type: string
          description: Text after the command name, passed verbatim to the handler.
    CommandRunResponse:
      type: object
      properties:
        command_id:
          type: string
          description: Pairs the command's `command/run` and `command/done` log events.
        name:
          type: string
        status:
          type: string
          enum: [success, error]
        text:
          type: string
          description: The handler's output or error text.
        item:
          $ref: "#/components/schemas/SlashCommandItem"
      required:
        - command_id
        - name
        - status
        - item
    Error:
      type: object
      properties:
        type:
          type: string
          description: Error class, for example `invalid_request_error`, `authentication_error`, or `server_error`.
        message:
          type: string
        code:
          type: string
          description: Stable machine-readable code, for example `resource_not_found`, `bad_request`, `unauthenticated`, `forbidden`, `store_unavailable`.
      required:
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
        - error
    ServiceTier:
      type: string
      enum:
        - auto
        - default
        - flex
        - priority
        - fast
    ReasoningEffort:
      type: string
      enum:
        - none
        - minimal
        - low
        - medium
        - high
        - xhigh
        - max
    SessionStatus:
      type: string
      enum:
        - idle
        - in_progress
        - requires_action
        - failed
    TurnStatus:
      type: string
      enum:
        - queued
        - in_progress
        - waiting
        - completed
        - failed
        - cancelled
    TokenUsage:
      type: object
      properties:
        input_tokens:
          type: integer
        input_tokens_details:
          type: object
          properties:
            cached_tokens:
              type: integer
          required:
            - cached_tokens
        output_tokens:
          type: integer
        output_tokens_details:
          type: object
          properties:
            reasoning_tokens:
              type: integer
          required:
            - reasoning_tokens
        total_tokens:
          type: integer
      required:
        - input_tokens
        - output_tokens
        - total_tokens
    FunctionTool:
      type: object
      properties:
        type:
          const: function
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        defer_loading:
          type: boolean
      required:
        - type
        - name
    McpHttpTransport:
      type: object
      properties:
        type:
          const: http
        server_url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
      required:
        - type
        - server_url
    McpStdioTransport:
      type: object
      properties:
        type:
          const: stdio
        command:
          type: string
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
      required:
        - type
        - command
    McpTool:
      type: object
      properties:
        type:
          const: mcp
        server_label:
          type: string
        transport:
          oneOf:
            - $ref: "#/components/schemas/McpHttpTransport"
            - $ref: "#/components/schemas/McpStdioTransport"
        allowed_tools:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        required:
          type: boolean
        connection_origin:
          type: string
          enum:
            - service
            - environment
        credential_id:
          oneOf:
            - type: string
            - type: "null"
        request_metadata:
          type: object
          additionalProperties: true
      required:
        - type
        - server_label
        - transport
      description: "Tools of `type` `web_search`, `tool_search`, and `programmatic_tool_calling` are rejected at create time; `credential_id` and `connection_origin: service` are rejected."
    ToolConfig:
      description: One tool on an agent. Only `function` and `mcp` are accepted by this gateway.
      oneOf:
        - $ref: "#/components/schemas/FunctionTool"
        - $ref: "#/components/schemas/McpTool"
    HostToolsConfig:
      type: object
      properties:
        allow:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        deny:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      description: "DSH extension: restricts the Host profile tools for the session. An empty object is rejected."
    MultiAgentConfig:
      type: object
      properties:
        enabled:
          type: boolean
        max_concurrent_subagents:
          oneOf:
            - type: integer
            - type: "null"
      required:
        - enabled
    ReasoningConfig:
      type: object
      properties:
        effort:
          oneOf:
            - $ref: "#/components/schemas/ReasoningEffort"
            - type: "null"
        summary:
          oneOf:
            - type: string
              enum:
                - auto
                - none
            - type: "null"
    TextConfig:
      type: object
      properties:
        format:
          oneOf:
            - type: object
              properties:
                type:
                  const: text
              required:
                - type
            - type: object
              properties:
                type:
                  const: json_schema
                schema:
                  type: object
                  additionalProperties: true
              required:
                - type
                - schema
        verbosity:
          type: string
          enum:
            - low
            - medium
            - high
    Agent:
      type: object
      properties:
        id:
          type: string
        object:
          const: agent
        created_at:
          type: integer
        updated_at:
          type: integer
        name:
          oneOf:
            - type: string
            - type: "null"
        instructions:
          oneOf:
            - type: string
            - type: "null"
        model:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolConfig"
        host_tools:
          oneOf:
            - $ref: "#/components/schemas/HostToolsConfig"
            - type: "null"
        multi_agent:
          oneOf:
            - $ref: "#/components/schemas/MultiAgentConfig"
            - type: "null"
        reasoning:
          oneOf:
            - $ref: "#/components/schemas/ReasoningConfig"
            - type: "null"
        service_tier:
          oneOf:
            - $ref: "#/components/schemas/ServiceTier"
            - type: "null"
        text:
          oneOf:
            - $ref: "#/components/schemas/TextConfig"
            - type: "null"
      required:
        - id
        - object
        - created_at
        - updated_at
        - name
        - instructions
        - model
        - metadata
        - tools
    AgentFields:
      type: object
      properties:
        name:
          oneOf:
            - type: string
            - type: "null"
        instructions:
          oneOf:
            - type: string
            - type: "null"
        metadata:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
        tools:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ToolConfig"
            - type: "null"
        host_tools:
          oneOf:
            - $ref: "#/components/schemas/HostToolsConfig"
            - type: "null"
        multi_agent:
          oneOf:
            - $ref: "#/components/schemas/MultiAgentConfig"
            - type: "null"
        reasoning:
          oneOf:
            - $ref: "#/components/schemas/ReasoningConfig"
            - type: "null"
        service_tier:
          oneOf:
            - $ref: "#/components/schemas/ServiceTier"
            - type: "null"
        text:
          oneOf:
            - $ref: "#/components/schemas/TextConfig"
            - type: "null"
    CreateAgentRequest:
      description: Saved agent configuration. `model` is required.
      allOf:
        - $ref: "#/components/schemas/AgentFields"
        - type: object
          properties:
            model:
              type: string
          required:
            - model
    UpdateAgentRequest:
      description: Omitted fields keep their saved values.
      allOf:
        - $ref: "#/components/schemas/AgentFields"
        - type: object
          properties:
            model:
              type: string
    HostToolCatalogEntry:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        source:
          const: host
      required:
        - name
        - description
        - parameters
        - source
    EnvironmentTemplateConfig:
      type: object
      properties:
        image:
          type: string
        setup:
          type: string
        packages:
          type: array
          items:
            type: string
        starter_files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
            required:
              - path
              - content
        default_env:
          type: object
          additionalProperties:
            type: string
    EnvironmentTemplate:
      type: object
      properties:
        id:
          type: string
        object:
          const: environment.template
        name:
          type: string
        provider:
          const: codebox
        config:
          $ref: "#/components/schemas/EnvironmentTemplateConfig"
        created_at:
          type: integer
        updated_at:
          type: integer
      required:
        - id
        - object
        - name
        - provider
        - config
        - created_at
    CreateTemplateRequest:
      type: object
      properties:
        name:
          type: string
        config:
          $ref: "#/components/schemas/EnvironmentTemplateConfig"
      required:
        - name
    UpdateTemplateRequest:
      type: object
      properties:
        name:
          type: string
        config:
          $ref: "#/components/schemas/EnvironmentTemplateConfig"
    EnvironmentStatus:
      type: string
      enum:
        - pending
        - connected
        - failed
        - cleanup
        - deleted
    Environment:
      type: object
      properties:
        id:
          type: string
        object:
          const: environment
        template_id:
          type: string
        session_id:
          type: string
        status:
          $ref: "#/components/schemas/EnvironmentStatus"
        provider:
          type: string
          enum:
            - codebox
            - local
        provider_metadata:
          type: object
          properties:
            codebox_id:
              type: string
            workspace_directory:
              type: string
        error:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer
      required:
        - id
        - object
        - status
        - provider
        - provider_metadata
        - created_at
    CreateEnvironmentRequest:
      type: object
      properties:
        template_id:
          type: string
        session_id:
          type: string
        image:
          type: string
      description: "`template_id` and `session_id` must belong to the caller."
    WriteEnvironmentFileRequest:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
          description: UTF-8 text.
        content_base64:
          type: string
          description: Base64 bytes, used when `content` is absent.
      required:
        - path
    EnvironmentFileWritten:
      type: object
      properties:
        object:
          const: environment.file
        path:
          type: string
        written:
          const: true
      required:
        - object
        - path
        - written
    FileEntry:
      type: object
      properties:
        path:
          type: string
      required:
        - path
    ArtifactEntry:
      type: object
      properties:
        path:
          type: string
        size:
          type: integer
        last_modified:
          type: string
      required:
        - path
    SelfHostedEnvironment:
      type: object
      properties:
        type:
          const: self_hosted
        id:
          type: string
        workspace_directory:
          type: string
        capability_directories:
          type: array
          items:
            type: string
        remote_url:
          type: string
      required:
        - type
    NoneEnvironment:
      type: object
      properties:
        type:
          const: none
      required:
        - type
    OpenAIHostedEnvironment:
      type: object
      properties:
        type:
          const: openai_hosted
      required:
        - type
    LocalEnvironment:
      type: object
      properties:
        type:
          const: local
        workspace_directory:
          type: string
      required:
        - type
        - workspace_directory
    SandboxEnvironment:
      type: object
      properties:
        type:
          const: sandbox
        environment_id:
          type: string
        template_id:
          type: string
      required:
        - type
      description: Sandbox sessions are not provisioned by this gateway.
    EnvironmentConfig:
      oneOf:
        - $ref: "#/components/schemas/NoneEnvironment"
        - $ref: "#/components/schemas/SelfHostedEnvironment"
        - $ref: "#/components/schemas/OpenAIHostedEnvironment"
        - $ref: "#/components/schemas/LocalEnvironment"
        - $ref: "#/components/schemas/SandboxEnvironment"
    QuestionOption:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
      required:
        - label
    Question:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        detail:
          type: string
        header:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
        multiSelect:
          type: boolean
        intent:
          type: object
          additionalProperties: true
          description: Presentation hint (`plan-review` or `approval`).
      required:
        - id
        - question
    FunctionCallAction:
      type: object
      properties:
        type:
          const: function_call
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        turn_id:
          type: string
        call_id:
          type: string
      required:
        - type
        - name
        - arguments
        - turn_id
        - call_id
    EnvironmentConnectionAction:
      type: object
      properties:
        type:
          const: environment_connection
        environment_id:
          type: string
      required:
        - type
        - environment_id
    ApprovalAction:
      type: object
      properties:
        type:
          const: approval
        id:
          type: string
          description: Answer with `agent.session.input.approval_response` and this id.
        kind:
          type: string
          enum:
            - sandbox_escalation
            - user_question
            - tool_approval
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
          description: '`["approve","deny"]` for an approval; the option labels of a single question, else empty.'
        tool_name:
          type: string
          description: Approvals only, when known.
        call_id:
          type: string
          description: When known.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
          description: "`user_question` with several questions."
      required:
        - type
        - id
        - kind
        - prompt
        - options
    RequiredAction:
      oneOf:
        - $ref: "#/components/schemas/FunctionCallAction"
        - $ref: "#/components/schemas/EnvironmentConnectionAction"
        - $ref: "#/components/schemas/ApprovalAction"
    AgentSession:
      type: object
      properties:
        id:
          type: string
        object:
          const: agent.session
        created_at:
          type: integer
        last_active_at:
          type: integer
        status:
          $ref: "#/components/schemas/SessionStatus"
        error:
          oneOf:
            - type: string
            - type: "null"
        metadata:
          type: object
          additionalProperties:
            type: string
        vault_ids:
          type: array
          items:
            type: string
        agent:
          $ref: "#/components/schemas/Agent"
        environment:
          $ref: "#/components/schemas/EnvironmentConfig"
        required_actions:
          type: array
          items:
            $ref: "#/components/schemas/RequiredAction"
        usage:
          oneOf:
            - $ref: "#/components/schemas/TokenUsage"
            - type: "null"
      required:
        - id
        - object
        - created_at
        - last_active_at
        - status
        - error
        - metadata
        - vault_ids
        - agent
        - environment
        - required_actions
        - usage
    AgentSessionWithHistory:
      description: The session, repeated under `session`, with its first 100 items and turns in ascending order. Returned by session create and by posting input events.
      allOf:
        - $ref: "#/components/schemas/AgentSession"
        - type: object
          properties:
            session:
              $ref: "#/components/schemas/AgentSession"
            items:
              type: array
              items:
                $ref: "#/components/schemas/SessionItem"
            turns:
              type: array
              items:
                $ref: "#/components/schemas/Turn"
          required:
            - session
            - items
            - turns
    InputMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          type: array
          description: >-
            `input_text` parts carry `text`. `input_image` and `input_file` parts carry `file_id` of a file uploaded with `POST /v1/agents/files`; a file may be used once. A message with files and no text is valid.
            `image_url`, `file_data`, and `file_url` are rejected with `400` `unsupported_content_part`. Images reach the model as images only on routes that accept them; on other routes they are sent as files. Every file is also copied to `uploads/` in the session workspace.
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
              file_id:
                type: string
                description: Required for `input_image` and `input_file`.
              filename:
                type: string
                description: Ignored; the stored name is used.
              detail:
                type: string
                description: Ignored.
            required:
              - type
      required:
        - role
    CreateSessionRequest:
      type: object
      properties:
        agent:
          description: Inline agent, or overrides of `agent_id`. `model` is required when `agent_id` is omitted.
          allOf:
            - $ref: "#/components/schemas/AgentFields"
            - type: object
              properties:
                model:
                  type: string
        agent_id:
          type: string
        environment:
          $ref: "#/components/schemas/EnvironmentConfig"
        metadata:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
        vault_ids:
          type: array
          items:
            type: string
        input:
          description: First user input.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/InputMessage"
        stream:
          type: boolean
          description: Answer with `text/event-stream` instead of JSON.
    UpdateSessionRequest:
      type: object
      properties:
        agent:
          type: object
          properties:
            model:
              type: string
              minLength: 1
              description: Retargets the live agent from the next model step. `null` and the empty string are rejected.
            reasoning:
              type: object
              properties:
                effort:
                  oneOf:
                    - $ref: "#/components/schemas/ReasoningEffort"
                    - type: "null"
            service_tier:
              oneOf:
                - $ref: "#/components/schemas/ServiceTier"
                - type: "null"
        metadata:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
    Turn:
      type: object
      properties:
        id:
          type: string
          description: "Deterministic: `turn_<log position of turn/start>`."
        object:
          const: agent.session.turn
        session_id:
          type: string
        agent_id:
          type: string
        status:
          $ref: "#/components/schemas/TurnStatus"
        created_at:
          type: integer
        started_at:
          oneOf:
            - type: integer
            - type: "null"
        completed_at:
          oneOf:
            - type: integer
            - type: "null"
        subagent_id:
          oneOf:
            - type: string
            - type: "null"
        error:
          oneOf:
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
              required:
                - code
                - message
            - type: "null"
        usage:
          oneOf:
            - $ref: "#/components/schemas/TokenUsage"
            - type: "null"
      required:
        - id
        - object
        - session_id
        - agent_id
        - status
        - created_at
    ToolCallStatus:
      type: string
      enum:
        - in_progress
        - completed
        - failed
        - incomplete
    ItemStatus:
      type: string
      enum:
        - in_progress
        - completed
        - incomplete
    InputFilePart:
      type: object
      description: >-
        An image or file the user attached, after the `input_text` part (which is absent when the message had no text). `file_id` is absent when the file was not uploaded through this API; the part then has name and size only and no content link.
      properties:
        type:
          type: string
          enum:
            - input_image
            - input_file
        file_id:
          type: string
          description: Id for `GET /v1/agents/files/{file_id}/content`.
        filename:
          type: string
        bytes:
          type: integer
        media_type:
          type: string
        width:
          type: integer
          description: Pixel width of the stored image (`input_image` only).
        height:
          type: integer
          description: Pixel height of the stored image (`input_image` only).
      required:
        - type
        - filename
        - bytes
        - media_type
      additionalProperties: false
    MessageItem:
      type: object
      properties:
        id:
          type: string
        type:
          const: message
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - input_text
                      - output_text
                  text:
                    type: string
                required:
                  - type
                  - text
              - $ref: "#/components/schemas/InputFilePart"
        phase:
          oneOf:
            - type: string
              enum:
