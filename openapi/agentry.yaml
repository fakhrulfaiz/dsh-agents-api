# OpenAPI 3.1 contract for @agentry/api. Edit this file directly; tests/openapi-*.spec.ts keep it in sync with the gateway.
openapi: 3.1.0
info:
  title: Agentry API
  version: 0.1.0
  description: |-
    OpenAI Agents API-compatible gateway for DeepSeek Harness (`@agentry/api`).

    Every `/v1` route needs `Authorization: Bearer <token>` and should send `OpenAI-Beta: agents=v1`. All agents, templates, environments, and sessions are scoped to the authenticated owner; another owner's id answers 404. The `/v1` prefix is the default `prefix` setting. Wire reference: docs/http-api.md.

    The admin API (`/admin/v1`) is not part of this version of the contract.
servers:
  - url: http://localhost:3080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Agents
  - name: Environments
  - name: Sessions
  - name: Subagents
  - name: Schedules
  - name: Files
  - name: Health
paths:
  /v1/agents:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    post:
      summary: Create a saved agent
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    get:
      summary: List saved agents
      tags:
        - Agents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
                  first_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  last_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  has_more:
                    type: boolean
                required:
                  - object
                  - data
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/tools:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    get:
      summary: List Host profile tools
      tags:
        - Agents
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
          description: Apply that session's `host_tools` mask. Omit for the full catalog.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostToolCatalogEntry"
                required:
                  - object
                  - data
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/skills:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    get:
      summary: List Host skills
      description: >-
        Skill catalog for a `/` picker, sorted by name; empty when the profile has no skill service.
        With `session_id` the catalog is that session's: its live agent scope and workspace. Without it, the default preset scope and the owner's default workspace root (when it exists).
        Cached in memory per scope and workspace (`skills.cacheTtlSeconds`). Send the `ETag` back as `If-None-Match` to receive `304`.
      tags:
        - Agents
      parameters:
        - name: session_id
          in: query
          required: false
          description: A session owned by the caller; another owner's or an unknown session answers `404`.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: Strong entity tag of the body.
            Cache-Control:
              schema:
                type: string
              description: "`private, max-age=0, must-revalidate`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSkill"
                required:
                  - object
                  - data
        "304":
          description: The `If-None-Match` tag matches the current catalog. No body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The skill catalog could not be loaded (`error.code` is `skills_unavailable`) or the store is unavailable (`store_unavailable`). Not cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/agents/commands:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    get:
      summary: List slash commands
      description: >-
        Host command catalog for the `/` menu, sorted by name. With `session_id` the catalog is that session's: its live agent scope, or the default preset scope when the session is not live (the session is not resumed to list). Without `session_id` the list is empty, because preset-scoped commands need an agent. Empty too when the profile has no command service.
        Cached in memory per scope (`commands.cacheTtlSeconds`) and dropped when the command registry or a session's preset changes. Send the `ETag` back as `If-None-Match` to receive `304`.
      tags:
        - Agents
      parameters:
        - name: session_id
          in: query
          required: false
          description: A session owned by the caller; another owner's or an unknown session answers `404`.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: Strong entity tag of the body.
            Cache-Control:
              schema:
                type: string
              description: "`private, max-age=0, must-revalidate`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentCommand"
                required:
                  - object
                  - data
        "304":
          description: The `If-None-Match` tag matches the current catalog. No body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The command catalog could not be loaded (`error.code` is `commands_unavailable`) or the store is unavailable (`store_unavailable`). Not cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/agents/sessions/{session_id}/commands/{name}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: Command name without the leading slash, from `GET /v1/agents/commands`.
        schema:
          type: string
    post:
      summary: Run a slash command
      description: >-
        Runs one Host command in the session, outside any turn. The command never reaches the model. The server builds the line `/{name} {input}`, resumes a stopped session, and answers when the handler settles.
        An expected failure (bad usage, nothing to do) is `200` with `status: error`. A command is refused with `409 session_busy` while a turn is running or another command is executing in the session.
      tags:
        - Sessions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRunRequest"
      responses:
        "200":
          description: The command ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session (`resource_not_found`) or command (`command_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A turn or command is running (`session_busy`), or the session cannot be resumed (`session_not_resumable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The handler threw (`command_failed`) or the resume failed (`session_resume_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/files:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    post:
      summary: Upload a file
      description: >-
        Stages one file for the caller, to attach to a message later (`input_image` / `input_file` parts with `file_id`).
        Send `multipart/form-data` with one `file` part and an optional `purpose` field (`user_data`). The server decides the media type from magic bytes (rasters) or the extension allow-list; the part's `Content-Type` is advisory and a contradicting raster type is refused.
        Limits come from the `uploads` config (defaults: 25 MiB per file, 500 MiB staged per owner). Staged files that are never sent are removed after `uploads.stagedTtlMinutes`.
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentEncoding: base64
                  contentMediaType: application/octet-stream
                purpose:
                  const: user_data
              required:
                - file
      responses:
        "201":
          description: Staged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
        "400":
          description: "`invalid_file`: not multipart, no or more than one `file` part, unusable name, empty file, or bad `purpose`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "`file_too_large`: over `uploads.maxFileBytes`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: "`unsupported_media_type`: type not allowed, or the content contradicts the name or declared raster type."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`staging_quota_exceeded`: the caller's staged bytes are at `uploads.maxStagedBytesPerOwner`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: "`uploads_disabled`: the server has no `uploads.dir`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/files/{file_id}/content:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/FileId"
    get:
      summary: Download a file
      description: >-
        Bytes of a staged or attached file of the caller. Another owner's id answers `404`. Rasters are served `inline`; everything else as an `attachment`, with SVG, HTML, and unknown types as `application/octet-stream`.
        Responses carry `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src 'none'`, and `Cache-Control: private, max-age=3600` (ids are immutable).
      tags:
        - Files
      responses:
        "200":
          description: The file bytes.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
          content:
            "*/*":
              schema:
                type: string
                contentMediaType: application/octet-stream
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: "`attachments_unavailable` (no DSH attachment service) or `store_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/agents/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/FileId"
    delete:
      summary: Remove a staged file
      description: Removes a file that has not been sent (a removed chip). A file attached to a message answers `409` `file_attached`.
      tags:
        - Files
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    const: file.deleted
                  deleted:
                    const: true
                required:
                  - id
                  - object
                  - deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/schedules:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    post:
      summary: Create a scheduled task
      tags:
        - Schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: "Creates a dedicated idle session for the task (metadata `source: schedule`), or targets the caller's own `session_id`, then stores the task with a `session` target. A rejected task deletes the session it created. `timing` is DSH's tagged union; input errors answer 400 with the Host code (`invalid_rule`, `invalid_time_zone`, `not_future`, `frequency_too_high`, `invalid_prompt`, ...)."
    get:
      summary: List scheduled tasks
      tags:
        - Schedules
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ScheduleStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: Only the caller's tasks, active first by next run, then paused and ended newest first. `after` names the last task of the previous page. `order` is ignored.
  /v1/agents/schedules/{schedule_id}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/ScheduleId"
    get:
      summary: Retrieve a scheduled task
      tags:
        - Schedules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSchedule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    post:
      summary: Update a scheduled task
      tags:
        - Schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: Send at least one of `title`, `prompt`, `timing`. `revision` (the `revision` last read) guards against a concurrent edit; a mismatch answers 409 `schedule_conflict`.
    delete:
      summary: Delete a scheduled task
      tags:
        - Schedules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    const: agent.schedule.deleted
                  deleted:
                    const: true
                required:
                  - id
                  - object
                  - deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: Deletes the task and its delivery history. The session it delivered to is kept.
  /v1/agents/schedules/{schedule_id}/pause:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Pause a scheduled task
      tags:
        - Schedules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSchedule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/schedules/{schedule_id}/resume:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Resume a scheduled task
      tags:
        - Schedules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: Resumes from the first future occurrence. A task with none answers 400 `not_future`.
  /v1/agents/schedules/{schedule_id}/run:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/ScheduleId"
    post:
      summary: Run a scheduled task now
      tags:
        - Schedules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSchedule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: Delivers the prompt to the task's session without moving the next occurrence, and answers after delivery. 409 `schedule_execution_pending` while a run is active, `schedule_target_archived` for an archived session, `session_not_resumable` when the session has no stored setup.
  /v1/agents/schedules/{schedule_id}/runs:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/ScheduleId"
    get:
      summary: List deliveries of a scheduled task
      tags:
        - Schedules
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: before
          in: query
          schema:
            type: string
          description: "`next_before` of the previous page."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRunList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/SchedulesUnavailable"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
      description: "Newest first. Each run is a delivery receipt: the message was durably accepted by the session, not that the model finished."
  /v1/agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/AgentId"
    get:
      summary: Retrieve a saved agent
      tags:
        - Agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    post:
      summary: Update a saved agent
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    delete:
      summary: Delete a saved agent
      tags:
        - Agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    const: agent.deleted
                  deleted:
                    const: true
                required:
                  - id
                  - object
                  - deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/environments/templates:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    post:
      summary: Create an environment template
      tags:
        - Environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
