        type:
          const: agent.session.input.message
        input:
          type: array
          items:
            $ref: "#/components/schemas/InputMessage"
        model:
          type: string
          description: Switch the session model from the next model step, before this message is queued. A model that no configured provider offers answers 409 `session_setting_not_live` and the message is not sent.
        reasoning:
          type: object
          properties:
            effort:
              description: "`null` clears the stored effort back to the agent's default."
              oneOf:
                - $ref: "#/components/schemas/ReasoningEffort"
                - type: "null"
      required:
        - type
        - input
