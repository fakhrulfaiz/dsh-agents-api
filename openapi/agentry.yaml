      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
    get:
      summary: List the files a turn changed
      tags:
        - Sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [object, turn_id, available, total, added, deleted, outside, files]
                properties:
                  object:
                    type: string
                    enum: [agent.session.turn.changes]
                  turn_id:
                    type: string
                  available:
                    type: boolean
                    description: "False when nothing was recorded for the turn or the summary is gone (summaries are kept in memory only, so an API restart loses them)."
                  total:
                    type: integer
                    description: "Changed files inside the workspace, including any beyond the 500 listed."
                  added:
                    type: integer
                  deleted:
                    type: integer
                  outside:
                    type: integer
                    description: "Changed files outside the workspace: counted, never listed or served."
                  files:
                    type: array
                    items:
                      type: object
                      required: [index, path, display, added, deleted]
                      properties:
                        index:
                          type: integer
                          description: "The file's index for the diff route."
                        path:
                          type: string
                        display:
                          type: string
                        added:
                          type: integer
                        deleted:
                          type: integer
                        binary:
                          type: boolean
                        oversized:
                          type: boolean
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/sessions/{session_id}/turns/{turn_id}/changes/{index}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    get:
      summary: Compare one changed file before and after a turn
      description: "404 when the index is not a listed file (files outside the workspace are never served) or the summary or snapshots are gone."
      tags:
        - Sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [object, kind, path, display]
                properties:
                  object:
                    type: string
                    enum: [agent.session.turn.change]
                  kind:
                    type: string
                    enum: [text, binary, oversized]
                  path:
                    type: string
                  display:
                    type: string
                  before:
                    type: boolean
                    description: "Whether the file existed at turn start (text only)."
                  after:
                    type: boolean
                  coarse:
                    type: boolean
                    description: "Every line shown as replaced (the line comparison took too long)."
                  hunks:
                    type: array
                    items:
                      type: object
                      required: [old_start, old_lines, new_start, new_lines, lines]
                      properties:
                        old_start:
                          type: integer
                        old_lines:
                          type: integer
                        new_start:
                          type: integer
                        new_lines:
                          type: integer
                        lines:
                          type: array
                          description: "Each line keeps its `+`, `-` or space prefix."
                          items:
                            type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/sessions/{session_id}/turns/{turn_id}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
    get:
      summary: Retrieve a turn
