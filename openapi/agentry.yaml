          type: string
        cwd:
          type: string
        exit_code:
          type: integer
        output:
          type: string
        duration_ms:
          type: number
        status:
          $ref: "#/components/schemas/ToolCallStatus"
        turn_id:
          type: string
        step:
          type: integer
          minimum: 1
          description: "Agentry extension: the assistant step (1-based within its turn) that produced or called this item."
        timing:
          $ref: "#/components/schemas/ItemTiming"
        subagent_id:
          type: string
      required:
        - id
        - type
        - command
        - status
        - turn_id
    ReasoningItem:
      type: object
      properties:
        id:
          type: string
        type:
          const: reasoning
        summary:
          type: array
          items:
            type: object
            properties:
              type:
                const: summary_text
              text:
                type: string
            required:
              - type
              - text
        status:
          $ref: "#/components/schemas/ItemStatus"
        turn_id:
          type: string
        step:
          type: integer
          minimum: 1
          description: "Agentry extension: the assistant step (1-based within its turn) that produced or called this item."
        timing:
          $ref: "#/components/schemas/ItemTiming"
        subagent_id:
          type: string
      required:
        - id
        - type
        - status
        - turn_id
    SlashCommandItem:
      description: >-
        Result of a Host slash command (`POST /v1/agents/sessions/{session_id}/commands/{name}`, or one run from another surface). Human-only output that never reaches the model.
      type: object
      properties:
        id:
          type: string
          description: "`item_cmd_<seq of the command's run event>`."
        type:
          const: slash_command
        command_id:
          type: string
        name:
          type: string
          description: Command name without the leading slash.
        args:
          type: string
          description: Text after the name, when the command recorded it.
        status:
          type: string
          enum: [completed, failed]
        text:
          type: string
        turn_id:
          type:
            - string
            - "null"
          description: Turn the command ran inside, or `null` when it ran between turns.
      required:
        - id
        - type
        - command_id
        - name
        - status
        - turn_id
    SessionItem:
      description: Discriminated by `type`. Item ids are deterministic functions of the Session log.
      oneOf:
        - $ref: "#/components/schemas/MessageItem"
        - $ref: "#/components/schemas/FunctionCallItem"
        - $ref: "#/components/schemas/FunctionCallOutputItem"
        - $ref: "#/components/schemas/McpCallItem"
        - $ref: "#/components/schemas/CommandExecutionItem"
        - $ref: "#/components/schemas/ReasoningItem"
        - $ref: "#/components/schemas/SlashCommandItem"
      discriminator:
        propertyName: type
    Subagent:
      type: object
      properties:
        id:
          type: string
        object:
          const: agent.session.subagent
        session_id:
          type: string
        parent_session_id:
          type: string
        status:
          type: string
          enum:
            - active
            - closed
        created_at:
          type: integer
        closed_at:
          type: integer
        model:
          type:
            - string
            - "null"
          description: Model of the subagent's latest model request, from its Session log; null before its first request.
      required:
        - id
        - object
        - session_id
        - parent_session_id
        - status
        - created_at
        - model
    SendMessageInputEvent:
      type: object
