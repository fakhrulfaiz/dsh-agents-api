    CreateScheduleRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        prompt:
          type: string
          minLength: 1
        timing:
          $ref: "#/components/schemas/ScheduleTiming"
        session_id:
