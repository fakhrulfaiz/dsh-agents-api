        - session_id
        - subagent
    SubagentUpdatedEvent:
      description: Ephemeral (no `id:`, never replayed). A subagent turn opened or ended; `turn` is its current state.
      type: object
      properties:
        type:
          const: agent.session.subagent.updated
        event_id:
          type: string
        session_id:
          type: string
        subagent:
          $ref: "#/components/schemas/Subagent"
        turn:
          $ref: "#/components/schemas/Turn"
      required:
        - type
        - event_id
        - session_id
        - subagent
        - turn
    SubagentClosedEvent:
      description: Ephemeral (no `id:`, never replayed). A subagent of this session closed.
      type: object
      properties:
        type:
          const: agent.session.subagent.closed
        event_id:
          type: string
        session_id:
          type: string
        subagent:
          $ref: "#/components/schemas/Subagent"
      required:
        - type
        - event_id
        - session_id
        - subagent
    SubagentItemAddedEvent:
      description: Ephemeral (no `id:`, never replayed). A subagent saved a tool call, which waits for its output. The item carries `subagent_id`.
      type: object
      properties:
        type:
          const: agent.session.subagent.item.added
        event_id:
          type: string
        session_id:
          type: string
        subagent_id:
          type: string
        turn_id:
          type: string
        item:
          $ref: "#/components/schemas/SessionItem"
      required:
        - type
        - event_id
        - session_id
        - subagent_id
        - turn_id
        - item
    SubagentItemDoneEvent:
      description: Ephemeral (no `id:`, never replayed). A subagent saved a final item (message, reasoning, tool output). The item carries `subagent_id`.
      type: object
      properties:
        type:
          const: agent.session.subagent.item.done
        event_id:
          type: string
        session_id:
          type: string
        subagent_id:
          type: string
        turn_id:
          type: string
        item:
          $ref: "#/components/schemas/SessionItem"
      required:
        - type
        - event_id
        - session_id
        - subagent_id
        - turn_id
        - item
    SessionEvent:
      description: JSON payload of one SSE frame. The frame `event:` name equals `type`.
      oneOf:
        - $ref: "#/components/schemas/SessionCreatedEvent"
        - $ref: "#/components/schemas/SessionIdleEvent"
        - $ref: "#/components/schemas/SessionInProgressEvent"
        - $ref: "#/components/schemas/SessionRequiresActionEvent"
        - $ref: "#/components/schemas/SessionFailedEvent"
        - $ref: "#/components/schemas/TurnCreatedEvent"
        - $ref: "#/components/schemas/TurnInProgressEvent"
        - $ref: "#/components/schemas/TurnCompletedEvent"
        - $ref: "#/components/schemas/TurnFailedEvent"
        - $ref: "#/components/schemas/TurnCancelledEvent"
        - $ref: "#/components/schemas/ItemAddedEvent"
        - $ref: "#/components/schemas/ItemDoneEvent"
        - $ref: "#/components/schemas/CommandItemDoneEvent"
        - $ref: "#/components/schemas/OutputTextDeltaEvent"
        - $ref: "#/components/schemas/OutputTextDoneEvent"
        - $ref: "#/components/schemas/ErrorEvent"
        - $ref: "#/components/schemas/SubagentCreatedEvent"
        - $ref: "#/components/schemas/SubagentUpdatedEvent"
        - $ref: "#/components/schemas/SubagentClosedEvent"
        - $ref: "#/components/schemas/SubagentItemAddedEvent"
        - $ref: "#/components/schemas/SubagentItemDoneEvent"
      discriminator:
        propertyName: type
    ScheduleStatus:
      type: string
      enum:
        - active
        - paused
        - ended
    ScheduleLocalAt:
      type: object
      properties:
        date:
          type: string
          description: Four-digit ISO calendar date.
        time:
          type: string
        time_zone:
          type: string
      required:
        - date
        - time
        - time_zone
    ScheduleTiming:
      description: "DSH's tagged union, identical on input and output. Reads echo `at` as the UTC instant and `time` as `HH:mm:ss.SSS`. Time zones are explicit IANA names."
      oneOf:
        - type: object
          properties:
            kind:
              const: after
            after_seconds:
              type: integer
              minimum: 1
          required:
            - kind
            - after_seconds
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: at
            at:
              oneOf:
                - type: string
                  description: RFC 3339 instant.
                - $ref: "#/components/schemas/ScheduleLocalAt"
          required:
            - kind
            - at
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: every
            every_seconds:
              type: integer
              minimum: 60
          required:
            - kind
            - every_seconds
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: daily
            daily:
              type: object
              properties:
                time:
                  type: string
                time_zone:
                  type: string
              required:
                - time
                - time_zone
          required:
            - kind
            - daily
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: weekly
            weekly:
              type: object
              properties:
                time:
                  type: string
                time_zone:
                  type: string
                weekdays:
                  type: array
                  description: ISO weekdays, Monday 1 through Sunday 7.
                  items:
                    type: integer
                    minimum: 1
                    maximum: 7
              required:
                - time
                - time_zone
                - weekdays
          required:
            - kind
            - weekly
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: cron
            cron:
              type: object
              properties:
                expression:
                  type: string
                  description: Five fields, minute hour day-of-month month day-of-week.
                time_zone:
                  type: string
              required:
                - expression
                - time_zone
          required:
            - kind
            - cron
          additionalProperties: false
        - type: object
          properties:
            kind:
              const: rrule
            rrule:
              type: string
              description: "`DTSTART` line and `RRULE` line."
          required:
            - kind
            - rrule
          additionalProperties: false
      discriminator:
        propertyName: kind
    AgentScheduleRun:
      type: object
