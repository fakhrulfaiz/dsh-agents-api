        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/sessions/{session_id}/subagents/{subagent_id}/turns/{turn_id}/items:
    parameters:
