# OpenAPI 3.1 contract for @agentry/api. Edit this file directly; tests/openapi-*.spec.ts keep it in sync with the gateway.
openapi: 3.1.0
info:
  title: Agentry API
  version: 0.1.0
  description: |-
    OpenAI Agents API-compatible gateway for DeepSeek Harness (`@agentry/api`).

    Every `/v1` route needs `Authorization: Bearer <token>` and should send `OpenAI-Beta: agents=v1`. All agents, templates, environments, and sessions are scoped to the authenticated owner; another owner's id answers 404. The `/v1` prefix is the default `prefix` setting. Wire reference: docs/http-api.md.

    The admin API (`/admin/v1`) is not part of this version of the contract.
servers:
  - url: http://localhost:3080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Agents
  - name: Environments
  - name: Sessions
  - name: Subagents
  - name: Schedules
  - name: Files
  - name: Projects
  - name: Health
paths:
  /v1/agents:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    post:
      summary: Create a saved agent
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    get:
      summary: List saved agents
      tags:
        - Agents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
                  first_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  last_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  has_more:
                    type: boolean
                required:
                  - object
                  - data
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/tools:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    get:
      summary: List Host profile tools
      tags:
        - Agents
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
          description: Apply that session's `host_tools` mask. Omit for the full catalog.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostToolCatalogEntry"
                required:
                  - object
                  - data
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/projects:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    post:
      summary: Create a project
      description: Creates an owner-scoped grouping of chats. `agent_id` and `environment` become the defaults for new chats started from this project; null keeps the caller's current defaults.
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    get:
      summary: List projects
      description: Only the caller's projects, newest first. `status` defaults to `active`; `after` is the last id of the previous page.
      tags:
        - Projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - archived
              - all
            default: active
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/ProjectId"
    get:
      summary: Retrieve a project
      tags:
        - Projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    post:
      summary: Update a project
      description: Replaces only the fields present in the body; omitted fields keep their values.
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    delete:
      summary: Delete a project
      description: Refuses with 409 `project_has_sessions` while any of the caller's chats still belongs to the project; archive it instead or move its chats first. The project's environment is not deleted.
      tags:
        - Projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    const: project.deleted
                  deleted:
                    const: true
                required:
                  - id
                  - object
                  - deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProjectConflict"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/projects/{project_id}/archive:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/ProjectId"
    post:
      summary: Archive a project
      description: Hides the project from the default `active` list and blocks new chats on it; existing chats and history stay untouched.
      tags:
        - Projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/projects/{project_id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/ProjectId"
    post:
      summary: Unarchive a project
      description: Restores the project to `active` and clears `archived_at`.
      tags:
        - Projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/skills/import:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    post:
      summary: Import a skill from GitHub
      description: Resolves `ref` (default branch when absent) to a commit, keeps only the folder at `path`, validates it like an upload, and stages it for review with its pinned origin. Public repositories only.
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo:
                  type: string
                  description: "`owner/name`."
                path:
                  type: string
                ref:
                  type: string
                scope:
                  type: string
                  enum: [library, agent]
                agent_id:
                  type: string
              required: [repo, path]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: "`skill_import_failed`: GitHub could not be reached, or has no such repository or ref."
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/agents/skills/{skill_id}/update:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Update a GitHub skill
      description: Re-imports the skill's `origin.ref`. Unchanged content answers the skill as it is; changed content replaces the files and returns the skill to `pending_review`.
      tags:
        - Agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: "`skill_import_failed`: GitHub could not be reached, or has no such repository or ref."
  /v1/agents/skills/view/{name}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: View a skill's files
      description: One of the caller's installed skills (by name), else an Agentry built-in. Bundled Host skills answer 404.
      tags:
        - Agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  kind:
                    type: string
                    enum: [builtin, library, private]
                  id:
                    type: string
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        bytes:
                          type: integer
                      required: [path, bytes]
                  skill_md:
                    type: string
                required: [name, description, kind, files, skill_md]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/skills/view/{name}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: File path inside the skill folder; may contain `/`.
        schema:
          type: string
    get:
      summary: Read one skill file as text
      description: Text files up to 256 KB. A path leaving the folder answers 400, a larger file 413, a binary file 415.
      tags:
        - Agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  bytes:
                    type: integer
                  content:
                    type: string
                required: [path, bytes, content]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: "`file_too_large`."
        "415":
          description: "`not_text`."
  /v1/agents/skills/installed:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    get:
      summary: List installed skills
      description: The caller's library and agent-private skills, oldest first, including ones still in review.
      tags:
        - Agents
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [library, agent]
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InstalledSkill"
                required: [object, data]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/skills/{skill_id}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Review an installed skill
      description: The skill, its files with sizes, and its full `SKILL.md`.
      tags:
        - Agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill:
                    $ref: "#/components/schemas/InstalledSkill"
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        bytes:
                          type: integer
                      required: [path, bytes]
                  skill_md:
                    type: string
                required: [skill, files, skill_md]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Edit a skill
      description: Changes the description and body of a skill written in Agentry (`editor` or `chat` source); other sources answer `400 skill_invalid`.
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                body:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a skill
      description: Removes the skill and its files. Agents that selected it keep a dangling id, which is ignored.
      tags:
        - Agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    const: agent.skill.deleted
                  deleted:
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/skills/{skill_id}/activate:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Activate a reviewed skill
      description: A skill in review is invisible to every model until activated.
      tags:
        - Agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/skills:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    get:
      summary: List Host skills
      description: >-
        Skill catalog for a `/` picker, sorted by name; empty when the profile has no skill service.
        With `session_id` the catalog is that session's: its live agent scope and workspace. Without it, the default preset scope and the owner's default workspace root (when it exists).
        Cached in memory per scope and workspace (`skills.cacheTtlSeconds`). Send the `ETag` back as `If-None-Match` to receive `304`.
      tags:
        - Agents
      parameters:
        - name: session_id
          in: query
          required: false
          description: A session owned by the caller; another owner's or an unknown session answers `404`.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: Strong entity tag of the body.
            Cache-Control:
              schema:
                type: string
              description: "`private, max-age=0, must-revalidate`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSkill"
                required:
                  - object
                  - data
        "304":
          description: The `If-None-Match` tag matches the current catalog. No body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The skill catalog could not be loaded (`error.code` is `skills_unavailable`) or the store is unavailable (`store_unavailable`). Not cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Install a skill
      description: >-
        `multipart/form-data` with a `.zip` in `file` (and `scope`, `agent_id`) stages the skill for review (`pending_review`).
        JSON `{ name, description, body, scope, agent_id }` writes a one-file skill that is active at once.
        At most 5 MB and 200 files; one `SKILL.md` at the root with `name` and `description` frontmatter; no symlinks, hidden or parent paths.
      tags:
        - Agents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                scope:
                  type: string
                  enum: [library, agent]
                agent_id:
                  type: string
              required: [file]
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                body:
                  type: string
                scope:
                  type: string
                  enum: [library, agent]
                agent_id:
                  type: string
              required: [name, description, body]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: "`skill_too_large`: over 5 MB or 200 files, or an archive that expands too far."
  /v1/agents/commands:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    get:
      summary: List slash commands
      description: >-
        Host command catalog for the `/` menu, sorted by name. With `session_id` the catalog is that session's: its live agent scope, or the default preset scope when the session is not live (the session is not resumed to list). Without `session_id` the list is empty, because preset-scoped commands need an agent. Empty too when the profile has no command service.
        Cached in memory per scope (`commands.cacheTtlSeconds`) and dropped when the command registry or a session's preset changes. Send the `ETag` back as `If-None-Match` to receive `304`.
      tags:
        - Agents
      parameters:
        - name: session_id
          in: query
          required: false
          description: A session owned by the caller; another owner's or an unknown session answers `404`.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: Strong entity tag of the body.
            Cache-Control:
              schema:
                type: string
              description: "`private, max-age=0, must-revalidate`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentCommand"
                required:
                  - object
                  - data
        "304":
          description: The `If-None-Match` tag matches the current catalog. No body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The command catalog could not be loaded (`error.code` is `commands_unavailable`) or the store is unavailable (`store_unavailable`). Not cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/agents/sessions/{session_id}/commands/{name}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: Command name without the leading slash, from `GET /v1/agents/commands`.
        schema:
          type: string
    post:
      summary: Run a slash command
      description: >-
        Runs one Host command in the session, outside any turn. The command never reaches the model. The server builds the line `/{name} {input}`, resumes a stopped session, and answers when the handler settles.
        An expected failure (bad usage, nothing to do) is `200` with `status: error`. A command is refused with `409 session_busy` while a turn is running or another command is executing in the session.
      tags:
        - Sessions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRunRequest"
      responses:
        "200":
          description: The command ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session (`resource_not_found`) or command (`command_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A turn or command is running (`session_busy`), or the session cannot be resumed (`session_not_resumable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The handler threw (`command_failed`) or the resume failed (`session_resume_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/files:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
    post:
      summary: Upload a file
      description: >-
        Stages one file for the caller, to attach to a message later (`input_image` / `input_file` parts with `file_id`).
        Send `multipart/form-data` with one `file` part and an optional `purpose` field (`user_data`). The server decides the media type from magic bytes (rasters) or the extension allow-list; the part's `Content-Type` is advisory and a contradicting raster type is refused.
        Limits come from the `uploads` config (defaults: 25 MiB per file, 500 MiB staged per owner). Staged files that are never sent are removed after `uploads.stagedTtlMinutes`.
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentEncoding: base64
                  contentMediaType: application/octet-stream
                purpose:
                  const: user_data
              required:
                - file
      responses:
        "201":
          description: Staged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
        "400":
          description: "`invalid_file`: not multipart, no or more than one `file` part, unusable name, empty file, or bad `purpose`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "`file_too_large`: over `uploads.maxFileBytes`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: "`unsupported_media_type`: type not allowed, or the content contradicts the name or declared raster type."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`staging_quota_exceeded`: the caller's staged bytes are at `uploads.maxStagedBytesPerOwner`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: "`uploads_disabled`: the server has no `uploads.dir`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    get:
      summary: List uploaded files, newest first
      description: The caller's own staged and attached files. `after` is the last id of the previous page; `order` is ignored (newest first).
      tags:
        - Files
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - staged
              - attached
          description: Keep only files in this status.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileObject"
                  first_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  last_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  has_more:
                    type: boolean
                required:
                  - object
                  - data
                  - first_id
                  - last_id
                  - has_more
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/agents/files/{file_id}/content:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/FileId"
    get:
      summary: Download a file
      description: >-
        Bytes of a staged or attached file of the caller, or of an image a tool returned (the `file_id` of an `output_image` part on a `function_call_output` item, `timg_` prefix). Another owner's id answers `404`. Rasters are served `inline`; everything else as an `attachment`, with SVG, HTML, and unknown types as `application/octet-stream`.
        Responses carry `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src 'none'`, and `Cache-Control: private, max-age=3600` (ids are immutable).
      tags:
        - Files
      responses:
        "200":
          description: The file bytes.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
          content:
            "*/*":
              schema:
                type: string
                contentMediaType: application/octet-stream
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: "`attachments_unavailable` (no DSH attachment service) or `store_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/agents/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/OpenAIBeta"
      - $ref: "#/components/parameters/FileId"
    delete:
