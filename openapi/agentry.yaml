        - created_at
        - last_active_at
        - status
        - error
        - metadata
        - vault_ids
        - agent
        - environment
        - required_actions
        - usage
    AgentSessionWithHistory:
      description: The session, repeated under `session`, with its first 100 items and turns in ascending order. Returned by session create and by posting input events.
      allOf:
        - $ref: "#/components/schemas/AgentSession"
        - type: object
          properties:
            session:
              $ref: "#/components/schemas/AgentSession"
            items:
              type: array
              items:
                $ref: "#/components/schemas/SessionItem"
            turns:
              type: array
              items:
                $ref: "#/components/schemas/Turn"
          required:
            - session
            - items
            - turns
    InputMessage:
      type: object
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          type: array
          description: >-
            `input_text` parts carry `text`. `input_image` and `input_file` parts carry `file_id` of a file uploaded with `POST /v1/agents/files`; a file may be used once. A message with files and no text is valid.
            `image_url`, `file_data`, and `file_url` are rejected with `400` `unsupported_content_part`. Images reach the model as images only on routes that accept them; on other routes they are sent as files. Every file is also copied to `uploads/` in the session workspace.
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
              file_id:
                type: string
                description: Required for `input_image` and `input_file`.
              filename:
                type: string
                description: Ignored; the stored name is used.
              detail:
                type: string
                description: Ignored.
            required:
              - type
      required:
        - role
    CreateSessionRequest:
      type: object
      properties:
        agent:
          description: Inline agent, or overrides of `agent_id`. `model` is required when `agent_id` is omitted.
          allOf:
            - $ref: "#/components/schemas/AgentFields"
            - type: object
              properties:
                model:
                  type: string
        agent_id:
          type: string
        environment:
          $ref: "#/components/schemas/EnvironmentConfig"
        metadata:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
        vault_ids:
          type: array
          items:
            type: string
        input:
          description: First user input.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/InputMessage"
        stream:
          type: boolean
          description: Answer with `text/event-stream` instead of JSON.
    UpdateSessionRequest:
      type: object
      properties:
        agent:
          type: object
          properties:
            model:
              type: string
              minLength: 1
              description: Retargets the live agent from the next model step. `null` and the empty string are rejected. A model that no configured provider offers answers 409 `session_setting_not_live` and nothing is stored.
            reasoning:
              type: object
              properties:
                effort:
                  description: "`null` clears the stored effort back to the agent's default."
                  oneOf:
                    - $ref: "#/components/schemas/ReasoningEffort"
                    - type: "null"
            service_tier:
              oneOf:
                - $ref: "#/components/schemas/ServiceTier"
                - type: "null"
        metadata:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
          description: Replaces the whole metadata map (OpenAI-compatible). Concurrent writers can drop each other's keys; use `metadata_merge` to change single keys.
        metadata_merge:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: "null"
          description: "Agentry extension. Sets the given keys and leaves the others; a `null` value deletes the key. The merge is atomic in the store, so concurrent merges of different keys both survive. Applied after `metadata` when both are sent."
    Turn:
      type: object
      properties:
        id:
          type: string
          description: "Deterministic: `turn_<log position of turn/start>`."
        object:
          const: agent.session.turn
        session_id:
          type: string
        agent_id:
          type: string
        status:
          $ref: "#/components/schemas/TurnStatus"
        created_at:
          type: integer
        started_at:
          oneOf:
            - type: integer
            - type: "null"
        completed_at:
          oneOf:
            - type: integer
            - type: "null"
        subagent_id:
          oneOf:
            - type: string
            - type: "null"
        error:
          oneOf:
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
              required:
                - code
                - message
            - type: "null"
        usage:
          oneOf:
            - $ref: "#/components/schemas/TokenUsage"
            - type: "null"
      required:
        - id
        - object
        - session_id
        - agent_id
        - status
        - created_at
    ToolCallStatus:
      type: string
      enum:
        - in_progress
        - completed
        - failed
        - incomplete
    ItemStatus:
      type: string
      enum:
        - in_progress
        - completed
        - incomplete
    OutputImagePart:
      type: object
      description: >-
        Agentry extension: one image a tool returned. `file_id` is derived from the session and the stored image, so live and replayed items carry the same id; it serves the bytes through `GET /v1/agents/files/{file_id}/content` for the session's owner only.
      properties:
        type:
          const: output_image
        file_id:
          type: string
          description: Id for `GET /v1/agents/files/{file_id}/content`.
        filename:
          type: string
        bytes:
          type: integer
        media_type:
          type: string
        width:
          type: integer
        height:
          type: integer
      required:
        - type
        - bytes
        - media_type
      additionalProperties: false
    InputFilePart:
      type: object
      description: >-
        An image or file the user attached, after the `input_text` part (which is absent when the message had no text). `file_id` is absent when the file was not uploaded through this API; the part then has name and size only and no content link.
      properties:
        type:
          type: string
          enum:
            - input_image
            - input_file
        file_id:
          type: string
          description: Id for `GET /v1/agents/files/{file_id}/content`.
        filename:
          type: string
        bytes:
          type: integer
        media_type:
          type: string
        width:
          type: integer
          description: Pixel width of the stored image (`input_image` only).
        height:
          type: integer
          description: Pixel height of the stored image (`input_image` only).
      required:
        - type
        - filename
        - bytes
        - media_type
      additionalProperties: false
    MessageItem:
