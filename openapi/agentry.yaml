            data:
              type: string
              description: Standard base64 file contents.
          required:
            - type
            - path
            - data
        - type: object
          properties:
            type:
              const: file_id
            path:
              type: string
            file_id:
              type: string
          required:
            - type
            - path
            - file_id
        - type: object
          properties:
            path:
              type: string
            content:
              type: string
              description: UTF-8 text.
            content_base64:
              type: string
              description: Base64 bytes, used when `content` is absent.
          required:
            - path
    EnvironmentFile:
      description: An `agent.environment.file`.
      type: object
      properties:
