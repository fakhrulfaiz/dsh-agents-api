                type: string
              name:
                type: string
              description:
                type: string
              version:
                type: string
            required:
              - type
              - name
              - description
        provider:
          type: string
          description: Extension. Name of the sandbox provider that backs the environment, for example `local`.
        name:
          type: string
          description: Extension. Display name given at create.
        sandbox:
          type: object
          description: "Extension (Agentry Sandbox environments): the sandbox's live state. `gone` once the sandbox no longer exists; `unknown` when the service did not answer."
          properties:
            state: { type: string, enum: [provisioning, running, stopped, failed, deleting, gone, unknown] }
            image: { type: string }
            place: { type: string, description: Id of the place the sandbox runs on. }
            gpus:
              oneOf:
                - { type: integer, minimum: 0 }
                - { const: all }
            started_at: { type: [integer, "null"] }
            last_used_at: { type: [integer, "null"] }
        provider_metadata:
          type: object
          description: Extension. Provider-owned handle; `workspace_directory` for `local`.
          additionalProperties:
            type: string
          properties:
            workspace_directory:
              type: string
        template_id:
          type: string
        session_id:
          type: string
        error:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer
      required:
        - id
        - object
        - type
        - status
        - files
        - plugins
        - skills
        - provider
        - provider_metadata
        - created_at
    CreateEnvironmentRequest:
      type: object
      properties:
        template_id:
          type: string
        session_id:
          type: string
        image:
          type: string
        provider:
          type: string
          description: Sandbox provider name; the template's, else the default.
        name:
          type: string
          description: Display name, at most 80 characters.
        place:
          type: string
          description: Extension. Id of the Agentry Sandbox place to create on (see `places` in `GET /agents/environments/providers`). Sandbox provider only; 400 for any other. Overrides the template's `place`.
      description: "`template_id` and `session_id` must belong to the caller."
    WriteEnvironmentFileRequest:
