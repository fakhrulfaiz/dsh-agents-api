          type: string
        object:
          const: agent.schedule
        title:
          type: string
        prompt:
          type: string
        timing:
          $ref: "#/components/schemas/ScheduleTiming"
        status:
          $ref: "#/components/schemas/ScheduleStatus"
        next_run_at:
          description: UTC instant of the next occurrence; null unless `status` is `active`.
          oneOf:
            - type: string
            - type: "null"
        created_at:
          type: string
        updated_at:
          type: string
        revision:
          type: string
          description: Equals `updated_at`. Send it back as `revision` on update.
        session_id:
          type: string
          description: Session that receives each run.
        running:
          type: boolean
        last_run:
          oneOf:
            - $ref: "#/components/schemas/AgentScheduleRun"
            - type: "null"
      required:
        - id
        - object
        - title
        - prompt
        - timing
        - status
        - next_run_at
        - created_at
        - updated_at
        - revision
        - session_id
        - running
        - last_run
    ScheduleList:
      type: object
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentSchedule"
        first_id:
          oneOf:
            - type: string
            - type: "null"
        last_id:
          oneOf:
            - type: string
            - type: "null"
        has_more:
          type: boolean
      required:
        - object
        - data
        - first_id
        - last_id
        - has_more
    ScheduleRunList:
      type: object
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentScheduleRun"
        has_more:
          type: boolean
        next_before:
          oneOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - has_more
        - next_before
    CreateScheduleRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        prompt:
          type: string
          minLength: 1
        timing:
          $ref: "#/components/schemas/ScheduleTiming"
        session_id:
          type: string
          description: Own session to deliver to. `agent_id`, `agent`, and `environment` are then ignored.
        agent_id:
          type: string
        agent:
