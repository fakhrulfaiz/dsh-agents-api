        type:
          const: none
      required:
        - type
    OpenAIHostedEnvironment:
      description: A hosted environment. Alone it uses the default workspace; with `environment_template_id` or any inline template field it provisions an environment through a sandbox provider (400 `sandbox_exec_unavailable` when the provider cannot run tools, 400 `sandbox_template_unsupported` when it cannot apply a field).
      type: object
      properties:
        type:
          const: openai_hosted
        environment_template_id:
          type: string
        provider:
          type: string
          description: Extension. Sandbox provider name.
        image:
          type: string
          description: Extension.
      additionalProperties: true
      required:
        - type
    LocalEnvironment:
      type: object
