components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Keycloak access token (production), an Agentry API key `agk_...` (apiKeys mode), or the development key (development mode). The principal needs the `agentry-user` or `agentry-admin` role.
  parameters:
    OpenAIBeta:
      name: OpenAI-Beta
      in: header
      required: false
      schema:
        const: agents=v1
      description: Clients should send `agents=v1`.
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    TurnId:
      name: turn_id
      in: path
      required: true
      schema:
        type: string
    SubagentId:
      name: subagent_id
      in: path
      required: true
      schema:
        type: string
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema:
        type: string
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema:
        type: string
    FilePath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Slash-separated path; remaining segments are part of the value.
      allowReserved: true
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      schema:
        type: string
      description: Id of the last item of the previous page.
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
      description: Ignored by the session list (newest first).
  responses:
    BadRequest:
      description: Invalid request. `error.code` is `bad_request`, `invalid_request`, `invalid_approval_response`, `decision_not_applicable`, `unknown_call_id`, `unsupported_content_part`, `duplicate_file_id`, or `too_many_files`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Missing or invalid credential. `error.code` is `unauthenticated`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      headers:
        WWW-Authenticate:
          schema:
            const: Bearer
    Forbidden:
      description: The principal holds neither `agentry-user` nor `agentry-admin`. `error.code` is `forbidden`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown id or another owner's record (`resource_not_found`), `approval_not_found` for an approval answer, or `file_not_found` for a file id in a message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "`session_setting_not_live` (model or effort change not applicable), `session_not_resumable`, `session_setup_failed` (the agent setup of a new session failed), `file_attached` (delete of an attached file), `file_already_attached`, or `uploads_unsafe` (the workspace `uploads` entry is a symlink or not a directory)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ScheduleConflict:
      description: "`schedule_conflict` (stale `revision`), `schedule_execution_pending`, `schedule_target_archived`, or `session_not_resumable`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProjectConflict:
      description: "`project_has_sessions`: the project still has chats and cannot be deleted."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SchedulesUnavailable:
      description: The profile has no schedule service. `error.code` is `schedules_unavailable`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: "`session_resume_failed`, `event_apply_failed`, or another internal error."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    StoreUnavailable:
      description: The Postgres store is opening, failed to start, or a database call failed. `error.code` is `store_unavailable`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AgentSkill:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
          description: "`builtin`, an install source (`upload`, `github`, `editor`, `chat`), or a Host discovery source such as `bundled`."
        kind:
          type: string
          enum: [builtin, library, private, bundled]
          description: "`builtin` is Agentry's own; `library` the owner's; `private` this agent's; `bundled` is always on (such as `office-*`)."
        id:
          type: string
          description: Installed skill id (`library` and `private` only).
        has_scripts:
          type: boolean
          description: Whether an installed skill includes executable files.
        enabled:
          type: boolean
          description: Whether the session's agent, or the default chat without `session_id`, uses the skill.
      required:
        - name
        - kind
        - enabled
    FileObject:
      type: object
      description: An uploaded file. `status` is `staged` until a message carrying it is sent, then `attached`.
      properties:
        id:
          type: string
          description: "`file_<random>`."
        object:
          const: file
        bytes:
          type: integer
        created_at:
          type: integer
          description: Epoch seconds.
        filename:
          type: string
          description: Sanitized leaf name.
        purpose:
          const: user_data
        media_type:
          type: string
          description: Server-decided media type.
        status:
          enum:
            - staged
            - attached
      required:
        - id
        - object
        - bytes
        - created_at
        - filename
        - purpose
        - media_type
        - status
    AgentCommand:
      type: object
      properties:
        name:
          type: string
          description: Lowercase command name without the leading slash.
        description:
          type: string
        input_hint:
          type: string
          description: Placeholder for the free-form text after the name; absent when the command takes none.
        accepts_attachments:
          type: boolean
      required:
        - name
        - description
        - accepts_attachments
    CommandRunRequest:
      type: object
      properties:
        input:
          type: string
          description: Text after the command name, passed verbatim to the handler.
    CommandRunResponse:
      type: object
      properties:
        command_id:
          type: string
          description: Pairs the command's `command/run` and `command/done` log events.
        name:
          type: string
        status:
          type: string
          enum: [success, error]
        text:
          type: string
          description: The handler's output or error text.
        item:
          $ref: "#/components/schemas/SlashCommandItem"
      required:
        - command_id
        - name
        - status
        - item
    Error:
      type: object
      properties:
        type:
          type: string
          description: Error class, for example `invalid_request_error`, `authentication_error`, or `server_error`.
        message:
          type: string
        code:
          type: string
          description: Stable machine-readable code, for example `resource_not_found`, `bad_request`, `unauthenticated`, `forbidden`, `store_unavailable`.
      required:
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
        - error
    ServiceTier:
      type: string
      enum:
        - auto
        - default
        - flex
        - priority
        - fast
    ReasoningEffort:
      type: string
      enum:
        - none
        - minimal
        - low
        - medium
        - high
        - xhigh
        - max
    SessionStatus:
      type: string
      enum:
        - idle
        - in_progress
        - requires_action
        - failed
    TurnStatus:
      type: string
      enum:
        - queued
        - in_progress
        - waiting
        - completed
        - failed
        - cancelled
    ItemTiming:
      type: object
      description: >-
        Agentry extension: when the Session log recorded an item, in epoch
        milliseconds. Each field is present only when the log has it; a running
        tool call has no completed_at_ms yet.
      properties:
        started_at_ms:
          type: integer
          description: An assistant step's start (its request was sent), or when a tool was called.
        first_token_at_ms:
          type: integer
          description: An assistant step's first streamed token.
        completed_at_ms:
          type: integer
          description: When the item finished (reply settled, tool answered, message logged).
    TokenUsage:
      type: object
      properties:
        input_tokens:
          type: integer
        input_tokens_details:
          type: object
          properties:
            cached_tokens:
              type: integer
          required:
            - cached_tokens
        output_tokens:
          type: integer
        output_tokens_details:
          type: object
          properties:
            reasoning_tokens:
              type: integer
          required:
            - reasoning_tokens
        total_tokens:
          type: integer
      required:
        - input_tokens
        - output_tokens
        - total_tokens
    FunctionTool:
      type: object
      properties:
        type:
          const: function
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        defer_loading:
          type: boolean
      required:
        - type
        - name
    McpHttpTransport:
      type: object
      properties:
        type:
          const: http
        server_url:
          type: string
        headers:
          type: object
          description: Request headers sent to the MCP server. Responses return every value masked as `***` (names are kept); a request that sends `***` to update saved-agent `tools` is rejected with 400 `bad_request`.
          additionalProperties:
            type: string
      required:
        - type
        - server_url
    McpStdioTransport:
      type: object
      properties:
        type:
          const: stdio
        command:
          type: string
        args:
          type: array
          items:
            type: string
        env:
          type: object
          description: Environment variables for the MCP server process. Responses return every value masked as `***` (names are kept); a request that sends `***` to update saved-agent `tools` is rejected with 400 `bad_request`.
          additionalProperties:
            type: string
      required:
        - type
        - command
    McpTool:
      type: object
      properties:
        type:
          const: mcp
        server_label:
          type: string
        transport:
          oneOf:
            - $ref: "#/components/schemas/McpHttpTransport"
            - $ref: "#/components/schemas/McpStdioTransport"
        allowed_tools:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        required:
          type: boolean
        connection_origin:
          type: string
          enum:
            - service
            - environment
        credential_id:
          oneOf:
            - type: string
            - type: "null"
        request_metadata:
          type: object
          additionalProperties: true
      required:
        - type
        - server_label
        - transport
      description: "Tools of `type` `web_search`, `tool_search`, and `programmatic_tool_calling` are rejected at create time; `credential_id` and `connection_origin: service` are rejected."
    ToolConfig:
      description: One tool on an agent. Only `function` and `mcp` are accepted by this gateway.
      oneOf:
        - $ref: "#/components/schemas/FunctionTool"
        - $ref: "#/components/schemas/McpTool"
    InstalledSkill:
      type: object
      description: A library or agent-private skill.
      properties:
        id:
          type: string
        object:
          const: agent.skill
        scope:
          type: string
          enum: [library, agent]
        agent_id:
          type: [string, "null"]
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [upload, github, editor, chat]
        origin:
          oneOf:
            - type: object
              properties:
                repo:
                  type: string
                path:
                  type: string
                ref:
                  type: string
                commit:
                  type: string
              required: [repo, path, ref, commit]
            - type: "null"
        content_hash:
          type: string
        has_scripts:
          type: boolean
        status:
          type: string
          enum: [pending_review, active]
        created_at:
          type: integer
        updated_at:
          type: integer
        used_by:
          type: array
          description: Ids of the caller's agents that use the skill.
          items:
            type: string
      required: [id, object, scope, agent_id, name, description, source, origin, content_hash, has_scripts, status, created_at, updated_at, used_by]
    AgentSkillSelection:
      type: object
      properties:
        builtin:
          type: array
          description: Built-in skill names.
          items:
            type: string
        library:
          type: array
          description: Library skill ids (`skill_` plus 32 hex characters).
          items:
            type: string
      required:
        - builtin
        - library
    HostToolsConfig:
      type: object
      properties:
        allow:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        deny:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      description: "DSH extension: restricts the Host profile tools for the session. An empty object is rejected."
    MultiAgentConfig:
      type: object
      properties:
        enabled:
          type: boolean
        max_concurrent_subagents:
          oneOf:
            - type: integer
            - type: "null"
      required:
        - enabled
    ReasoningConfig:
      type: object
      properties:
        effort:
          oneOf:
            - $ref: "#/components/schemas/ReasoningEffort"
            - type: "null"
        summary:
          oneOf:
            - type: string
              enum:
                - auto
                - none
            - type: "null"
    TextConfig:
      type: object
      properties:
        format:
          oneOf:
            - type: object
              properties:
                type:
                  const: text
              required:
                - type
            - type: object
              properties:
                type:
                  const: json_schema
                schema:
                  type: object
                  additionalProperties: true
              required:
                - type
                - schema
        verbosity:
          type: string
          enum:
            - low
            - medium
            - high
    Project:
      description: An owner-scoped grouping of chats with optional default agent and workspace. `null` environment means the caller's default workspace.
      type: object
      properties:
        id:
          type: string
        object:
          const: project
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
        pinned:
          type: boolean
        agent_id:
          oneOf:
            - type: string
            - type: "null"
        environment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentConfig"
            - type: "null"
        archived_at:
          oneOf:
            - type: integer
            - type: "null"
        created_at:
          type: integer
        updated_at:
          type: integer
      required:
        - id
        - object
        - name
        - status
        - pinned
        - agent_id
        - environment
        - archived_at
        - created_at
        - updated_at
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Must not be empty after trimming.
        agent_id:
          oneOf:
            - type: string
            - type: "null"
        environment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentConfig"
            - type: "null"
        pinned:
          type: boolean
          default: false
      required:
        - name
    UpdateProjectRequest:
      description: Fields to replace on a project; omitted fields keep their values.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Must not be empty after trimming.
        agent_id:
          oneOf:
            - type: string
            - type: "null"
        environment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentConfig"
            - type: "null"
        pinned:
          type: boolean
    ProjectListResponse:
      type: object
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        first_id:
          oneOf:
            - type: string
            - type: "null"
        last_id:
          oneOf:
            - type: string
            - type: "null"
        has_more:
          type: boolean
      required:
        - object
        - data
    Agent:
      type: object
      properties:
        id:
          type: string
        object:
          const: agent
        created_at:
          type: integer
        updated_at:
          type: integer
        name:
          oneOf:
            - type: string
            - type: "null"
        instructions:
          oneOf:
            - type: string
            - type: "null"
        model:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolConfig"
        host_tools:
          oneOf:
            - $ref: "#/components/schemas/HostToolsConfig"
            - type: "null"
        apps:
          description: "Agentry extension: Composio app grants, app slug to `all` or exact tool slugs. Absent or null is unrestricted; the legacy `metadata.connectors` list still means `all` per app. Every Composio call, including each call in a multi-execute batch, is checked."
          oneOf:
            - type: object
              additionalProperties:
                oneOf:
                  - const: all
                  - type: array
                    items:
                      type: string
            - type: "null"
        send_policy:
          description: "Agentry extension: `ask` (default) asks before each app call whose tool slug is a write (send, create, update, delete, …); `auto` does not ask."
          oneOf:
            - type: string
              enum: [ask, auto]
            - type: "null"
        browser:
          description: "Agentry extension: the web browser (Playwright MCP tools `mcp__browser__*`). It runs only in sandbox chats, inside the sandbox; a chat on the server gets no browser tools. `true` always tries to start it; `false` never does (no tools, no notice). Absent or `null` is auto (the server default `browser.default`): the browser mounts when the chat's sandbox has it, otherwise there are no tools and the prompt says the sandbox has no browser."
          oneOf:
            - type: boolean
            - type: "null"
        skills:
          description: "Agentry extension: skill selection. Absent or null uses every built-in skill; an explicit selection uses exactly the listed built-ins and library skills. The agent's private skills always apply."
          oneOf:
            - $ref: "#/components/schemas/AgentSkillSelection"
            - type: "null"
        multi_agent:
          oneOf:
            - $ref: "#/components/schemas/MultiAgentConfig"
            - type: "null"
        reasoning:
          oneOf:
            - $ref: "#/components/schemas/ReasoningConfig"
            - type: "null"
        service_tier:
          oneOf:
            - $ref: "#/components/schemas/ServiceTier"
            - type: "null"
        text:
          oneOf:
            - $ref: "#/components/schemas/TextConfig"
            - type: "null"
      required:
        - id
        - object
        - created_at
        - updated_at
        - name
        - instructions
        - model
        - metadata
        - tools
    AgentFields:
      type: object
      properties:
        name:
          oneOf:
            - type: string
            - type: "null"
        instructions:
          oneOf:
            - type: string
            - type: "null"
        metadata:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"
        tools:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ToolConfig"
            - type: "null"
        host_tools:
          oneOf:
            - $ref: "#/components/schemas/HostToolsConfig"
            - type: "null"
        apps:
          description: "Agentry extension: Composio app grants, app slug to `all` or exact tool slugs. Absent or null is unrestricted; the legacy `metadata.connectors` list still means `all` per app. Every Composio call, including each call in a multi-execute batch, is checked."
          oneOf:
            - type: object
              additionalProperties:
                oneOf:
                  - const: all
                  - type: array
                    items:
                      type: string
            - type: "null"
        send_policy:
          description: "Agentry extension: `ask` (default) asks before each app call whose tool slug is a write (send, create, update, delete, …); `auto` does not ask."
          oneOf:
            - type: string
              enum: [ask, auto]
            - type: "null"
        browser:
          description: "Agentry extension: the web browser (Playwright MCP tools `mcp__browser__*`). It runs only in sandbox chats, inside the sandbox; a chat on the server gets no browser tools. `true` always tries to start it; `false` never does (no tools, no notice). Absent or `null` is auto (the server default `browser.default`): the browser mounts when the chat's sandbox has it, otherwise there are no tools and the prompt says the sandbox has no browser."
          oneOf:
            - type: boolean
            - type: "null"
        skills:
          description: "Agentry extension: skill selection. Absent or null uses every built-in skill; an explicit selection uses exactly the listed built-ins and library skills. The agent's private skills always apply."
          oneOf:
            - $ref: "#/components/schemas/AgentSkillSelection"
            - type: "null"
        multi_agent:
          oneOf:
            - $ref: "#/components/schemas/MultiAgentConfig"
            - type: "null"
        reasoning:
          oneOf:
            - $ref: "#/components/schemas/ReasoningConfig"
            - type: "null"
        service_tier:
          oneOf:
            - $ref: "#/components/schemas/ServiceTier"
            - type: "null"
        text:
          oneOf:
            - $ref: "#/components/schemas/TextConfig"
            - type: "null"
    CreateAgentRequest:
      description: Saved agent configuration. `model` is required.
      allOf:
        - $ref: "#/components/schemas/AgentFields"
        - type: object
          properties:
            model:
              type: string
          required:
            - model
    UpdateAgentRequest:
      description: Omitted fields keep their saved values.
      allOf:
        - $ref: "#/components/schemas/AgentFields"
        - type: object
          properties:
            model:
              type: string
    HostToolCatalogEntry:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        source:
          const: host
      required:
        - name
        - description
        - parameters
        - source
    TemplateFileInput:
      oneOf:
        - type: object
          properties:
            type:
              const: inline
            path:
              type: string
            data:
              type: string
              description: Standard base64 file contents.
          required:
            - type
            - path
            - data
        - type: object
          properties:
            type:
              const: file_id
            path:
              type: string
            file_id:
              type: string
          required:
            - type
            - path
            - file_id
    EnvironmentTemplate:
      description: An `agent.environment.template` as the OpenAI Agents API defines it. Confidential parts (inline file data, `env`, setup commands, archives) are never returned; `provider`, `image`, `unsupported_fields` and `built_in` are extensions. Built-in templates (`tpl_builtin_*`) lead the first page of the list when the isolated sandbox is configured; they cannot be changed or deleted (400).
      type: object
      properties:
        id:
          type: string
        built_in:
          type: boolean
        object:
          const: agent.environment.template
        name:
          type:
            - string
            - "null"
        created_at:
          type: integer
        updated_at:
          type: integer
        capability_directories:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - inline
                  - file_id
              path:
                type: string
              file_id:
                type: string
              size_bytes:
                type: integer
            required:
              - type
              - path
        network:
          type: object
          properties:
            access:
              type: string
              enum:
                - enabled
                - disabled
                - restricted
            allowed_domains:
              type: array
              items:
                type: string
          required:
            - access
            - allowed_domains
        packages:
          type: object
          properties:
            npm:
              type: array
              items:
                type: string
            python:
              type: array
              items:
                type: string
            system:
              type: array
              items:
                type: string
          required:
            - npm
            - python
            - system
        plugins:
          type: array
          items:
            type: object
            properties:
              type:
                const: inline
              name:
                type: string
              description:
                type: string
            required:
              - type
              - name
              - description
        skills:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - skill_reference
                  - inline
              skill_id:
                type: string
              version:
                type: string
              name:
                type: string
              description:
                type: string
            required:
              - type
        provider:
          type: string
          description: Extension. Sandbox provider that provisions environments from this template. Templates stored before providers were pluggable may say `codebox`, which no longer exists.
        image:
          type: string
          description: Extension. Container image for container providers.
        place:
          type: string
          description: Extension (`sandbox` provider). Id of the Agentry Sandbox place to run on; the default place when absent.
        gpus:
          oneOf:
            - type: integer
              minimum: 0
            - const: all
          description: Extension (`sandbox` provider). GPUs to give the sandbox, a count or `all`.
        unsupported_fields:
          type: array
          description: Extension. Template fields set to something the provider cannot apply; provisioning fails while any remain.
          items:
            type: string
      required:
        - id
        - object
        - name
        - created_at
        - updated_at
        - capability_directories
        - files
        - network
        - packages
        - plugins
        - skills
        - provider
        - unsupported_fields
    CreateTemplateRequest:
      description: The OpenAI Agents API template create params, plus the `provider` and `image` extensions. The earlier nested form (`config` with `image`, `setup`, `packages` list, `starter_files`, `default_env`) is still accepted.
      type: object
      properties:
        name:
          type:
            - string
            - "null"
        capability_directories:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/TemplateFileInput"
        network:
          type: object
          properties:
            access:
              type: string
              enum:
                - enabled
                - disabled
                - restricted
            allowed_domains:
              type: array
              items:
                type: string
          required:
            - access
        packages:
          type: object
          properties:
            npm:
              type: array
              items:
                type: string
            python:
              type: array
              items:
                type: string
            system:
              type: array
              items:
                type: string
        plugins:
          type: array
          items:
            type: object
        setup_commands:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              cwd:
