      enum:
        - pending
        - connected
        - disconnected
        - expired
        - failed
    Environment:
      description: An `agent.environment` as the OpenAI Agents API defines it, plus the extension fields `provider`, `provider_metadata`, `template_id`, `session_id`, `error`, `created_at` and `updated_at`.
      type: object
      properties:
        id:
          type: string
        object:
          const: agent.environment
        type:
          type: string
          enum:
            - openai_hosted
            - self_hosted
          description: "`self_hosted` for directories this application hosts (the local provider), `openai_hosted` for a provider-provisioned sandbox."
        status:
          $ref: "#/components/schemas/EnvironmentStatus"
        files:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - inline
                  - file_id
              id:
                type: string
              file_id:
                type: string
              path:
                type: string
              size_bytes:
                type: integer
            required:
              - type
              - id
              - path
              - size_bytes
        plugins:
          type: array
          items:
            type: object
            properties:
              type:
                const: inline
              name:
                type: string
              description:
                type: string
