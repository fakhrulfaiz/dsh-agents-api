        path:
          type: string
        size:
          type: integer
        last_modified:
          type: string
      required:
        - path
    SelfHostedEnvironment:
      type: object
      properties:
        type:
          const: self_hosted
        id:
          type: string
        workspace_directory:
          type: string
        capability_directories:
          type: array
          items:
            type: string
        remote_url:
          type: string
      required:
        - type
    NoneEnvironment:
      type: object
