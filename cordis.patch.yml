# OpenAI Agents API HTTP gateway over dsh-base.
# Inserted after the base layer. Host and port are deployment fallbacks;
# a later profile patch may replace this row's complete config.

- insert:
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: '0.0.0.0'
        port: 3080

    - id: agents-api
      name: '@deepseek-ai/dsh-experimental-agents-api'
      config:
        apiKey: ''
        prefix: '/v1'
