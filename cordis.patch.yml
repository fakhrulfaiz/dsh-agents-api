# OpenAI Agents API routes on the profile webserver.
# This patch does not insert a second webserver. The web app bundle owns
# `id: webserver`; this plugin registers `/v1` and `/health` on that server.

- insert:
    - id: agents-api
      name: '@deepseek-ai/dsh-experimental-agents-api'
      config:
        apiKey: ''
        prefix: '/v1'
