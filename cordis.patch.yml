# OpenAI Agents API routes on the profile webserver.
# This patch does not insert a second webserver. The web app bundle owns
# `id: webserver`; this plugin registers `/v1` and `/health` on that server.

- insert:
    - id: agents-api
      name: '@agentry/api'
      config:
        prefix: '/v1'
        workspaces: !!js process.env.AGENTRY_WORKSPACES
        database:
          url: !!js process.env.AGENTRY_DATABASE_URL
        uploads:
          dir: !!js process.env.AGENTRY_UPLOADS_DIR ?? `${process.env.HOME}/.dsh/agentry-uploads`
        auth:
          mode: development
          devKey:
            key: !!js process.env.AGENTRY_DEV_KEY
            owner: dev

# Office skills (docx, pptx, xlsx, render, recalculate, export-pdf, office) in
# the host-level skill layer, so every preset's tool-skill lists them by name.
# workspace-dependencies mounts the prebuilt Python (python-docx, openpyxl, ...)
# built by `pnpm run prepare:primary-runtime` in the DSH checkout.
- insert:
    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      config:
        source: !!js process.env.AGENTRY_OFFICE_RUNTIME ?? `${process.env.HOME}/.dsh/office-runtime/primary-runtime`

    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      config:
        assetRoot: !!js (process.env.AGENTRY_OFFICE_RUNTIME ?? `${process.env.HOME}/.dsh/office-runtime/primary-runtime`) + '/../office-skills'
        node: !!js (process.env.AGENTRY_OFFICE_RUNTIME ?? `${process.env.HOME}/.dsh/office-runtime/primary-runtime`) + '/dependencies/node/bin/node'

# Composio Connect (phase 0, single user): one profile-wide MCP server, tools
# appear as mcp__composio__*. The consumer key stays in the harness
# environment (COMPOSIO_API_KEY), never in agent records or session config.
- insert:
    - id: mcp-composio
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: composio
        transport: streamable-http
        url: https://connect.composio.dev/mcp
        failOnStartupError: false
        headers:
          x-consumer-api-key: !!js process.env.COMPOSIO_API_KEY

# Cap per-call shell timeouts at the default (2 min) so one slow command
# (e.g. a filesystem-wide find over /mnt on WSL) cannot hold a turn for 10 min.
- id: bash-local
  config:
    maxTimeoutMs: 120000

# ── Agentry identity ─────────────────────────────────────────────────────────
# Agentry presents as a general-purpose agent: no DeepSeek Harness opener, no
# DSH GUI developer context. The persona lives in the Agentry preset below
# (sessions mount it by id, see src/preset.ts); DSH's own presets are untouched.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ''

- id: harness-dev-context
  disabled: true

# The Agentry agent preset: DSH's web `standard` preset copied verbatim except
# the persona and the skill roots (developer skill folders are hidden; Agentry
# skills come from the agent-scoped `agentry` provider). Keep in step with the
# pinned `packages/bundle/web-app/presets/standard.patch.yml`; the drift test in
# tests/agentry-identity.spec.ts fails when they diverge.
- insert:
    - id: preset-agentry
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: agentry
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Agentry, a general-purpose AI agent running on the {{model}} model. You help with research, writing, analysis, documents and spreadsheets, working in the user's connected apps, scheduling recurring tasks, creating and managing other agents, and software work: reading, writing and running code in your workspace. Pick the approach the task needs; do not assume every request is a coding task. When asked who or what you are, say you are Agentry.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set false to drop the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
